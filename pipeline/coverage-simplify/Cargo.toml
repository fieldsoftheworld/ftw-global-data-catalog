[package]
name = "coverage-simplify"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
description = "Ordered parallel port of GEOS 3.13.1 coverage simplification"

[dependencies]
anyhow = "1"
arrow-array = "60"
arrow-schema = "60"
clap = { version = "4", features = ["derive"] }
libloading = "0.9"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1.12"
robust = "1.2"
rstar = "0.13"
rustc-hash = "2"
serde_json = "1"

[profile.release]
debug = 1
