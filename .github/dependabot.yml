version: 2
# One PR a week per ecosystem: every update, major included, lands in a single grouped PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # torch and ONNX Runtime stay at the versions the golden self-test passed with, because H100
  # and A100 outputs agree within 1/255 only on these. They move by hand, with a new self-test.
  # Only pipeline/inference lists them.
  - package-ecosystem: pip
    directories:
      - /pipeline/inference
      - /pipeline/mosaics
      - /pipeline/postprocessing
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: torch
      - dependency-name: onnxruntime
      - dependency-name: onnxruntime-gpu
      - dependency-name: "nvidia-*"
