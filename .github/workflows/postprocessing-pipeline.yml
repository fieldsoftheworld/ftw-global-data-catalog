name: Postprocessing pipeline
on:
  pull_request:
    paths: ['pipeline/postprocessing/**', '.github/workflows/postprocessing-pipeline.yml']
  push:
    branches: [main]
    paths: ['pipeline/postprocessing/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/postprocessing/requirements.txt pytest
      - run: python -c 'import duckdb; duckdb.sql("INSTALL spatial")'
      - run: python -m pytest -q pipeline/postprocessing/tests
