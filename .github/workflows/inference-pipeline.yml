name: Inference pipeline
on:
  pull_request:
    paths: ['pipeline/inference/**', '.github/workflows/inference-pipeline.yml']
  push:
    branches: [main]
    paths: ['pipeline/inference/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13 is deliberately newer than root ci.yml's 3.12: the pipeline
          # wheels were verified against cp313 (incl. rasterio's bundled GDAL).
          python-version: '3.13'
      # onnx is a test-only dependency: torch.onnx.export needs it to build the
      # fixed- and dynamic-batch fixtures the preflight test checks.
      - run: python -m pip install -r pipeline/inference/requirements.txt pytest onnx pyflakes
      # The root CI lints tools/ and tests/ the same way; pipeline/ was uncovered.
      - run: pyflakes pipeline/inference/*.py
      - run: python -m pytest -q -rs pipeline/inference
