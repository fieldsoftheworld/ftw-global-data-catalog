name: Inference pipeline
on:
  pull_request:
    paths: ['pipeline/inference/**', '.github/workflows/inference-pipeline.yml']
  push:
    branches: [main]
    paths: ['pipeline/inference/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/inference/requirements.txt pytest
      - run: python -m pytest -q pipeline/inference/test_inference.py
