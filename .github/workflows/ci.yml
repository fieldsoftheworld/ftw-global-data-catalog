name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # rashid takes a floor, not a pin, so CI picks up each 0.1.x release
      # while refusing one older than the rules the gate asserts. The floor
      # is 0.1.8, the first release that accepts a v0.2.0 root self link;
      # tests/test_portolan_conformance.py checks the same range at run time.
      #
      # stac-check stays unpinned on purpose. The stac-check exemption in
      # docs/conformance.md expires when the upstream crash stops. That only
      # happens if CI takes each new release.
      - name: Install the validators
        run: python -m pip install 'rashid>=0.1.8,<0.2.0' stac-check pyarrow numpy duckdb shapely pyproj rasterio

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py pipeline/*.py

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
